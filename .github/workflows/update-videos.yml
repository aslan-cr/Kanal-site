name: Son videoları güncelle

on:
  schedule:
    - cron: "17 * * * *" # her saat
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/fetch-videos.mjs, .github/workflows/update-videos.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-videos.mjs
      - name: Değişiklikleri kaydet
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data/videos.json
            git commit -m "Son videolar güncellendi"
            git push
          fi
